services:
  postgres:
    image: postgres:15-alpine
    container_name: personalia-postgres-local
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-personalia}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asd}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ../be/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-personalia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: personalia-redis-local
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
      target: production
    image: personalia/backend:local
    container_name: personalia-backend-local
    ports:
      - "${BACKEND_EXTERNAL_PORT:-3002}:3001"
    env_file:
      - ../../backend/${BACKEND_ENV_FILE:-.env.local.example}
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
      DB_PORT: ${DB_PORT_DOCKER:-5432}
      DB_NAME: ${DB_NAME:-personalia}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-asd}
      REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
      REDIS_PORT: ${REDIS_PORT_DOCKER:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ../../backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - personalia-network
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3002}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_bWlnaHR5LW9yaW9sZS00Ni5jbGVyay5hY2NvdW50cy5kZXYk}
        VITE_CLERK_SIGN_IN_URL: ${VITE_CLERK_SIGN_IN_URL:-https://staging-new-sas.bpkpenaburjakarta.or.id/}
        VITE_CLERK_DOMAIN: ${VITE_CLERK_DOMAIN:-http://localhost:5174}
        VITE_CLERK_IS_SATELLITE: ${VITE_CLERK_IS_SATELLITE:-true}
    image: personalia/frontend:local
    container_name: personalia-frontend-local
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3003}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - personalia-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: personalia-loki-local
    ports:
      - "${LOKI_EXTERNAL_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data_local:/loki
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3100/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: personalia-promtail-local
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_ENDPOINT: ${LOKI_ENDPOINT:-http://loki:3100/loki/api/v1/push}
    volumes:
      - ../observability/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9080/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

volumes:
  postgres_data_local:
    driver: local
  redis_data_local:
    driver: local
  loki_data_local:
    driver: local

networks:
  personalia-network:
    driver: bridge
