name: personalia-jkt

services:
  postgres:
    image: postgres:15-alpine
    container_name: personalia-jkt-postgres-local
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-personalia}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asd}
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ../be/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-personalia}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: personalia-jkt-redis-local
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
      target: production
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
    image: personalia/backend:local
    container_name: personalia-jkt-backend-local
    ports:
      - "${BACKEND_EXTERNAL_PORT:-3001}:3001"
    env_file:
      - ../../backend/${BACKEND_ENV_FILE:-.env.local.example}
    environment:
      NODE_ENV: ${BACKEND_NODE_ENV:-production}
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_PORT: ${DB_PORT_DOCKER:-5432}
      DB_NAME: ${DB_NAME:-personalia}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-asd}
      REDIS_HOST: ${REDIS_HOST_DOCKER:-redis}
      REDIS_PORT: ${REDIS_PORT_DOCKER:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002}
    volumes:
      - ../../backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - personalia-network
    restart: unless-stopped

  frontend:
    image: ${NODE_IMAGE:-node:20-alpine}
    container_name: personalia-jkt-frontend-local
    command: ["node", "/app/serve-static.mjs", "/app/dist", "3000"]
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3002}:3000"
    volumes:
      - ../../frontend/dist:/app/dist:ro
      - ../../scripts/serve-static.mjs:/app/serve-static.mjs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - personalia-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: personalia-jkt-loki-local
    ports:
      - "${LOKI_EXTERNAL_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data_local:/loki
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3100/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: personalia-jkt-promtail-local
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_ENDPOINT: ${LOKI_ENDPOINT:-http://loki:3100/loki/api/v1/push}
    volumes:
      - ../observability/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9080/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

volumes:
  postgres_data_local:
    driver: local
  redis_data_local:
    driver: local
  loki_data_local:
    driver: local

networks:
  personalia-network:
    driver: bridge
