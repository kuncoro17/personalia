stages:
  - validate
  - test
  - build
  - deploy
  - post-deploy

variables:
  LOG_LEVEL: INFO
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  APP_NAME: "personalia-jkt"
  CONTAINER_IMAGE: "$CI_REGISTRY_IMAGE"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

default:
  image: node:20-alpine

cache:
  key: npm-v2-${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

.deploy-template: &deploy-template
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

.docker-build-template: &docker-build-template
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker info

# ==================== VALIDATE ====================

lint-backend:
  stage: validate
  before_script:
    - cd backend
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npm run lint:check
    - npm run format:check
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint-frontend:
  stage: validate
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npm run lint
    - npm run format:check
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ==================== TEST ====================

test-backend:
  stage: test
  variables:
    NODE_ENV: test
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_NAME: personalia_test
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ""
    AUTO_SYNC_MODELS: "true"
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: personalia_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    - name: redis:7-alpine
      alias: redis
  before_script:
    - cd backend
    - npm ci --no-audit --no-fund --prefer-offline
    - apk add --no-cache netcat-openbsd
    - |
      if getent hosts postgres >/dev/null 2>&1; then
        export DB_HOST="postgres"
      else
        export DB_HOST="127.0.0.1"
      fi
      echo "Using PostgreSQL host: $DB_HOST"
      echo "Waiting for PostgreSQL to be ready..."
      timeout 60 sh -c 'until nc -z "$DB_HOST" 5432; do echo "Waiting for postgres..."; sleep 2; done'
    - echo "PostgreSQL is ready"
  script:
    - npm run test:ci
  artifacts:
    paths:
      - backend/coverage/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - lint-backend

test-frontend:
  stage: test
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - lint-frontend

# ==================== BUILD ====================

build-backend-staging:
  <<: *docker-build-template
  script:
    - docker build -t "$CONTAINER_IMAGE/backend:staging" -f backend/Dockerfile.prod backend
    - docker push "$CONTAINER_IMAGE/backend:staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - test-backend

build-frontend-staging:
  <<: *docker-build-template
  script:
    - docker build -t "$CONTAINER_IMAGE/frontend:staging" -f frontend/Dockerfile.prod frontend
    - docker push "$CONTAINER_IMAGE/frontend:staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - test-frontend

build-backend-production:
  <<: *docker-build-template
  script:
    - docker build -t "$CONTAINER_IMAGE/backend:production" -f backend/Dockerfile.prod backend
    - docker push "$CONTAINER_IMAGE/backend:production"
    - docker tag "$CONTAINER_IMAGE/backend:production" "$CONTAINER_IMAGE/backend:latest"
    - docker push "$CONTAINER_IMAGE/backend:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - test-backend

build-frontend-production:
  <<: *docker-build-template
  script:
    - docker build -t "$CONTAINER_IMAGE/frontend:production" -f frontend/Dockerfile.prod frontend
    - docker push "$CONTAINER_IMAGE/frontend:production"
    - docker tag "$CONTAINER_IMAGE/frontend:production" "$CONTAINER_IMAGE/frontend:latest"
    - docker push "$CONTAINER_IMAGE/frontend:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - test-frontend

# ==================== DEPLOY ====================

deploy-staging:
  stage: deploy
  <<: *deploy-template
  script:
    - echo "Deploying to staging server..."
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "mkdir -p /opt/$APP_NAME/deployment /opt/$APP_NAME/backend/deployment /opt/$APP_NAME/backend/uploads"

    # Copy deployment artifacts
    - scp deployment/docker-compose.staging.yml "$STAGING_SERVER_USER@$STAGING_SERVER_IP:/opt/$APP_NAME/deployment/docker-compose.yml"
    - scp backend/.env.staging "$STAGING_SERVER_USER@$STAGING_SERVER_IP:/opt/$APP_NAME/backend/.env.staging"
    - scp backend/deployment/init-db.sql "$STAGING_SERVER_USER@$STAGING_SERVER_IP:/opt/$APP_NAME/backend/deployment/init-db.sql"

    # Pull + run services
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "cd /opt/$APP_NAME && export CONTAINER_IMAGE='$CONTAINER_IMAGE' IMAGE_TAG='staging' BACKEND_ENV_FILE='.env.staging' && docker compose -f deployment/docker-compose.yml pull"
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "cd /opt/$APP_NAME && export CONTAINER_IMAGE='$CONTAINER_IMAGE' IMAGE_TAG='staging' BACKEND_ENV_FILE='.env.staging' && docker compose -f deployment/docker-compose.yml up -d --remove-orphans"

    # Diagnostics
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "cd /opt/$APP_NAME && docker compose -f deployment/docker-compose.yml ps"
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "docker logs personalia-backend --since 5m --tail 80 || true"
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "docker logs personalia-frontend --since 5m --tail 80 || true"

  environment:
    name: staging
    url: https://$STAGING_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - build-backend-staging
    - build-frontend-staging

deploy-production:
  stage: deploy
  <<: *deploy-template
  script:
    - echo "Deploying to production server..."
    - '[ -n "$BACKEND_ENV_PRODUCTION" ] || (echo "BACKEND_ENV_PRODUCTION CI variable is required" && exit 1)'
    - ssh "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP" "mkdir -p /opt/$APP_NAME/deployment /opt/$APP_NAME/backend/deployment /opt/$APP_NAME/backend/uploads"

    # Copy deployment artifacts
    - scp deployment/docker-compose.staging.yml "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP:/opt/$APP_NAME/deployment/docker-compose.yml"
    - printf "%s" "$BACKEND_ENV_PRODUCTION" | ssh "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP" "cat > /opt/$APP_NAME/backend/.env.production"
    - scp backend/deployment/init-db.sql "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP:/opt/$APP_NAME/backend/deployment/init-db.sql"

    # Pull + run services
    - ssh "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP" "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - ssh "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP" "cd /opt/$APP_NAME && export CONTAINER_IMAGE='$CONTAINER_IMAGE' IMAGE_TAG='production' BACKEND_ENV_FILE='.env.production' && docker compose -f deployment/docker-compose.yml pull"
    - ssh "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP" "cd /opt/$APP_NAME && export CONTAINER_IMAGE='$CONTAINER_IMAGE' IMAGE_TAG='production' BACKEND_ENV_FILE='.env.production' && docker compose -f deployment/docker-compose.yml up -d --remove-orphans"

    # Diagnostics
    - ssh "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP" "cd /opt/$APP_NAME && docker compose -f deployment/docker-compose.yml ps"
    - ssh "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP" "docker logs personalia-backend --since 5m --tail 80 || true"
    - ssh "$PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_IP" "docker logs personalia-frontend --since 5m --tail 80 || true"

  environment:
    name: production
    url: https://$PRODUCTION_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build-backend-production
    - build-frontend-production

# ==================== POST-DEPLOY ====================

health-check-staging:
  stage: post-deploy
  image: curlimages/curl:8.11.1
  script:
    - echo "Waiting for services to be ready..."
    - sleep 30
    - echo "Checking backend health..."
    - curl -f --connect-timeout 10 --max-time 30 "https://$STAGING_DOMAIN/health"
    - echo "Checking frontend availability..."
    - curl -f --connect-timeout 10 --max-time 30 "https://$STAGING_DOMAIN/"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - deploy-staging

health-check-production:
  stage: post-deploy
  image: curlimages/curl:8.11.1
  script:
    - echo "Waiting for services to be ready..."
    - sleep 30
    - echo "Checking backend health..."
    - curl -f --connect-timeout 10 --max-time 30 "https://$PRODUCTION_DOMAIN/health"
    - echo "Checking frontend availability..."
    - curl -f --connect-timeout 10 --max-time 30 "https://$PRODUCTION_DOMAIN/"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - deploy-production
