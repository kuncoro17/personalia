stages:
  - validate
  - test
  - build
  - deploy
  - post-deploy

variables:
  LOG_LEVEL: INFO
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  APP_NAME: "personalia-jkt"
  CONTAINER_IMAGE: "$CI_REGISTRY_IMAGE"
  NPM_CONFIG_CACHE: "/tmp/.npm"

default:
  image: node:20-alpine
##
.deploy-template: &deploy-template
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client docker-cli wget
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config


.docker-build-template: &docker-build-template
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - |
      if [ -z "$CI_REGISTRY" ]; then
        echo "Missing CI_REGISTRY"
        exit 1
      fi
      if [ -z "$CONTAINER_IMAGE" ]; then
        echo "Missing CONTAINER_IMAGE (Container Registry may be disabled)"
        exit 1
      fi
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - 'echo "Using registry image: $CONTAINER_IMAGE"'
    - docker info

# ==================== VALIDATE ====================

lint-backend:
  stage: validate
  before_script:
    - cd backend
    - rm -rf /tmp/.npm && mkdir -p /tmp/.npm
    - npm ci --cache /tmp/.npm --no-audit --no-fund --prefer-online --omit=optional
    - npm cache clean --force
  script:
    - npm run lint:check
    - npm run format:check
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint-frontend:
  stage: validate
  before_script:
    - cd frontend
    - rm -rf /tmp/.npm && mkdir -p /tmp/.npm
    - npm ci --cache /tmp/.npm --no-audit --no-fund --prefer-online
    - npm cache clean --force
  script:
    - npm run lint
    - npm run format:check
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ==================== TEST ====================

test-backend:
  stage: test
  variables:
    NODE_ENV: test
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_NAME: personalia_test
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ""
    AUTO_SYNC_MODELS: "true"
  services:
    - name: postgres:15
      alias: postgres
      variables:
        POSTGRES_DB: personalia_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    - name: redis:7-alpine
      alias: redis
  before_script:
    - cd backend
    - rm -rf /tmp/.npm && mkdir -p /tmp/.npm
    - npm ci --cache /tmp/.npm --no-audit --no-fund --prefer-online --omit=optional
    - npm cache clean --force
    - apk add --no-cache postgresql-client || apk add --no-cache postgresql16-client || apk add --no-cache postgresql17-client
    - |
      DB_HOST_CANDIDATES="postgres 127.0.0.1"
      export DB_HOST=""
      for host in $DB_HOST_CANDIDATES; do
        echo "Checking PostgreSQL on $host:5432 ..."
        if timeout 10 sh -c "until PGPASSWORD=\"$DB_PASSWORD\" pg_isready -h \"$host\" -p 5432 -U \"$DB_USER\" -d \"$DB_NAME\"; do sleep 1; done"; then
          export DB_HOST="$host"
          break
        fi
      done
      if [ -z "$DB_HOST" ]; then
        echo "PostgreSQL service is unreachable on both postgres and 127.0.0.1"
        exit 1
      fi
      echo "Using PostgreSQL host: $DB_HOST"
    - echo "PostgreSQL is ready"
  script:
    - npm run test:ci
  artifacts:
    paths:
      - backend/coverage/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - lint-backend

test-frontend:
  stage: test
  before_script:
    - cd frontend
    - rm -rf /tmp/.npm && mkdir -p /tmp/.npm
    - npm ci --cache /tmp/.npm --no-audit --no-fund --prefer-online
    - npm cache clean --force
  script:
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - lint-frontend

# ==================== BUILD ====================

build-backend-staging:
  <<: *docker-build-template
  script:
    - docker build -t "$CONTAINER_IMAGE:backend-staging" -f backend/Dockerfile.prod backend
    - docker push "$CONTAINER_IMAGE:backend-staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - test-backend

build-frontend-staging:
  <<: *docker-build-template
  script:
    - docker build --build-arg VITE_API_URL="${STAGING_FE_API_URL:-/api}" -t "$CONTAINER_IMAGE:frontend-staging" -f frontend/Dockerfile.prod frontend
    - docker push "$CONTAINER_IMAGE:frontend-staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - test-frontend

build-backend-production:
  <<: *docker-build-template
  script:
    - docker build -t "$CONTAINER_IMAGE:backend-production" -f backend/Dockerfile.prod backend
    - docker push "$CONTAINER_IMAGE:backend-production"
    - docker tag "$CONTAINER_IMAGE:backend-production" "$CONTAINER_IMAGE:backend-latest"
    - docker push "$CONTAINER_IMAGE:backend-latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - test-backend

build-frontend-production:
  <<: *docker-build-template
  script:
    - docker build -t "$CONTAINER_IMAGE:frontend-production" -f frontend/Dockerfile.prod frontend
    - docker push "$CONTAINER_IMAGE:frontend-production"
    - docker tag "$CONTAINER_IMAGE:frontend-production" "$CONTAINER_IMAGE:frontend-latest"
    - docker push "$CONTAINER_IMAGE:frontend-latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - test-frontend

# ==================== DEPLOY ====================

deploy-staging:
  stage: deploy
  <<: *deploy-template
  script:
    - '[ -n "$STAGING_SERVER_USER" ] || (echo "Missing CI variable: STAGING_SERVER_USER" && exit 1)'
    - '[ -n "$STAGING_SERVER_IP" ] || (echo "Missing CI variable: STAGING_SERVER_IP" && exit 1)'
    - '[ -n "$STAGING_DOMAIN" ] || (echo "Missing CI variable: STAGING_DOMAIN" && exit 1)'
    - export STAGING_TARGET="${STAGING_SERVER_USER}@${STAGING_SERVER_IP}"
    - export STAGING_TMP_DIR="/tmp/${APP_NAME}-${CI_PIPELINE_ID}-staging"
    - echo "Deploying to staging server..."
    - ssh "$STAGING_TARGET" "mkdir -p '$STAGING_TMP_DIR'"
    - ssh "$STAGING_TARGET" "sudo mkdir -p /opt/$APP_NAME/deployment/compose /opt/$APP_NAME/deployment/be /opt/$APP_NAME/deployment/nginx/staging /opt/$APP_NAME/deployment/observability /opt/$APP_NAME/backend/uploads"
    - ssh "$STAGING_TARGET" "sudo chown -R $STAGING_SERVER_USER:$STAGING_SERVER_USER /opt/$APP_NAME"
    - scp deployment/compose/docker-compose.staging.yml "$STAGING_TARGET:$STAGING_TMP_DIR/docker-compose.staging.yml"
    - scp backend/.env.staging "$STAGING_TARGET:$STAGING_TMP_DIR/.env.staging"
    - scp deployment/be/init-db.sql "$STAGING_TARGET:$STAGING_TMP_DIR/init-db.sql"
    - scp deployment/nginx/staging/frontend.conf "$STAGING_TARGET:$STAGING_TMP_DIR/frontend.conf"
    - scp deployment/nginx/staging/api.conf "$STAGING_TARGET:$STAGING_TMP_DIR/api.conf"
    - scp deployment/observability/loki-config.yaml "$STAGING_TARGET:$STAGING_TMP_DIR/loki-config.yaml"
    - scp deployment/observability/promtail-staging-config.yaml "$STAGING_TARGET:$STAGING_TMP_DIR/promtail-staging-config.yaml"
    - ssh "$STAGING_TARGET" "sudo install -m 644 '$STAGING_TMP_DIR/docker-compose.staging.yml' '/opt/$APP_NAME/deployment/compose/docker-compose.staging.yml'"
    - ssh "$STAGING_TARGET" "sudo install -m 600 '$STAGING_TMP_DIR/.env.staging' '/opt/$APP_NAME/backend/.env.staging'"
    - ssh "$STAGING_TARGET" "sudo chown '$STAGING_SERVER_USER:$STAGING_SERVER_USER' '/opt/$APP_NAME/backend/.env.staging'"
    - ssh "$STAGING_TARGET" "sudo install -m 644 '$STAGING_TMP_DIR/init-db.sql' '/opt/$APP_NAME/deployment/be/init-db.sql'"
    - ssh "$STAGING_TARGET" "sudo install -m 644 '$STAGING_TMP_DIR/frontend.conf' '/opt/$APP_NAME/deployment/nginx/staging/frontend.conf'"
    - ssh "$STAGING_TARGET" "sudo install -m 644 '$STAGING_TMP_DIR/api.conf' '/opt/$APP_NAME/deployment/nginx/staging/api.conf'"
    - ssh "$STAGING_TARGET" "sudo install -m 644 '$STAGING_TMP_DIR/loki-config.yaml' '/opt/$APP_NAME/deployment/observability/loki-config.yaml'"
    - ssh "$STAGING_TARGET" "sudo install -m 644 '$STAGING_TMP_DIR/promtail-staging-config.yaml' '/opt/$APP_NAME/deployment/observability/promtail-staging-config.yaml'"
    - ssh "$STAGING_TARGET" "rm -rf '$STAGING_TMP_DIR'"
    - ssh "$STAGING_TARGET" "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - ssh "$STAGING_TARGET" "cd /opt/$APP_NAME && export BACKEND_IMAGE='$CONTAINER_IMAGE:backend-staging' FRONTEND_IMAGE='$CONTAINER_IMAGE:frontend-staging' BACKEND_ENV_FILE='.env.staging' && docker compose -f deployment/compose/docker-compose.staging.yml pull"
    - ssh "$STAGING_TARGET" "cd /opt/$APP_NAME && export BACKEND_IMAGE='$CONTAINER_IMAGE:backend-staging' FRONTEND_IMAGE='$CONTAINER_IMAGE:frontend-staging' BACKEND_ENV_FILE='.env.staging' && docker compose -f deployment/compose/docker-compose.staging.yml up -d --remove-orphans"
    - ssh "$STAGING_TARGET" "cd /opt/$APP_NAME && export BACKEND_IMAGE='$CONTAINER_IMAGE:backend-staging' FRONTEND_IMAGE='$CONTAINER_IMAGE:frontend-staging' BACKEND_ENV_FILE='.env.staging' && docker compose -f deployment/compose/docker-compose.staging.yml ps"
    - ssh "$STAGING_TARGET" "docker logs personalia-backend --since 5m --tail 80 || true"
    - ssh "$STAGING_TARGET" "docker logs personalia-frontend --since 5m --tail 80 || true"
    - ssh "$STAGING_TARGET" "docker logs personalia-loki --since 5m --tail 120 || true"
    - ssh "$STAGING_TARGET" "docker logs personalia-promtail --since 5m --tail 120 || true"

  environment:
    name: staging
    url: https://$STAGING_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - build-backend-staging
    - build-frontend-staging

deploy-production:
  stage: deploy
  <<: *deploy-template
  script:
    - echo "Deploying to production server..."
    - '[ -n "$BACKEND_ENV_PRODUCTION" ] || (echo "BACKEND_ENV_PRODUCTION CI variable is required" && exit 1)'
    - '[ -n "$PRODUCTION_SERVER_USER" ] || (echo "Missing CI variable: PRODUCTION_SERVER_USER" && exit 1)'
    - '[ -n "$PRODUCTION_SERVER_IP" ] || (echo "Missing CI variable: PRODUCTION_SERVER_IP" && exit 1)'
    - export PRODUCTION_TARGET="${PRODUCTION_SERVER_USER}@${PRODUCTION_SERVER_IP}"
    - export PRODUCTION_TMP_DIR="/tmp/${APP_NAME}-${CI_PIPELINE_ID}-production"
    - ssh "$PRODUCTION_TARGET" "mkdir -p '$PRODUCTION_TMP_DIR'"
    - printf "%s" "$BACKEND_ENV_PRODUCTION" > /tmp/.env.production

    # Copy deployment artifacts
    - scp deployment/compose/docker-compose.staging.yml "$PRODUCTION_TARGET:$PRODUCTION_TMP_DIR/docker-compose.staging.yml"
    - scp /tmp/.env.production "$PRODUCTION_TARGET:$PRODUCTION_TMP_DIR/.env.production"
    - scp deployment/be/init-db.sql "$PRODUCTION_TARGET:$PRODUCTION_TMP_DIR/init-db.sql"
    - scp deployment/nginx/staging/frontend.conf "$PRODUCTION_TARGET:$PRODUCTION_TMP_DIR/frontend.conf"
    - scp deployment/nginx/staging/api.conf "$PRODUCTION_TARGET:$PRODUCTION_TMP_DIR/api.conf"
    - scp deployment/observability/loki-config.yaml "$PRODUCTION_TARGET:$PRODUCTION_TMP_DIR/loki-config.yaml"
    - scp deployment/observability/promtail-staging-config.yaml "$PRODUCTION_TARGET:$PRODUCTION_TMP_DIR/promtail-staging-config.yaml"
    - ssh "$PRODUCTION_TARGET" "sudo mkdir -p /opt/$APP_NAME/deployment/compose /opt/$APP_NAME/deployment/be /opt/$APP_NAME/deployment/nginx/staging /opt/$APP_NAME/deployment/observability /opt/$APP_NAME/backend/uploads"
    - ssh "$PRODUCTION_TARGET" "sudo install -m 644 '$PRODUCTION_TMP_DIR/docker-compose.staging.yml' '/opt/$APP_NAME/deployment/compose/docker-compose.staging.yml'"
    - ssh "$PRODUCTION_TARGET" "sudo install -m 600 '$PRODUCTION_TMP_DIR/.env.production' '/opt/$APP_NAME/backend/.env.production'"
    - ssh "$PRODUCTION_TARGET" "sudo chown '$PRODUCTION_SERVER_USER:$PRODUCTION_SERVER_USER' '/opt/$APP_NAME/backend/.env.production'"
    - ssh "$PRODUCTION_TARGET" "sudo install -m 644 '$PRODUCTION_TMP_DIR/init-db.sql' '/opt/$APP_NAME/deployment/be/init-db.sql'"
    - ssh "$PRODUCTION_TARGET" "sudo install -m 644 '$PRODUCTION_TMP_DIR/frontend.conf' '/opt/$APP_NAME/deployment/nginx/staging/frontend.conf'"
    - ssh "$PRODUCTION_TARGET" "sudo install -m 644 '$PRODUCTION_TMP_DIR/api.conf' '/opt/$APP_NAME/deployment/nginx/staging/api.conf'"
    - ssh "$PRODUCTION_TARGET" "sudo install -m 644 '$PRODUCTION_TMP_DIR/loki-config.yaml' '/opt/$APP_NAME/deployment/observability/loki-config.yaml'"
    - ssh "$PRODUCTION_TARGET" "sudo install -m 644 '$PRODUCTION_TMP_DIR/promtail-staging-config.yaml' '/opt/$APP_NAME/deployment/observability/promtail-staging-config.yaml'"
    - ssh "$PRODUCTION_TARGET" "rm -rf '$PRODUCTION_TMP_DIR'"

    # Pull + run services
    - ssh "$PRODUCTION_TARGET" "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - ssh "$PRODUCTION_TARGET" "cd /opt/$APP_NAME && export BACKEND_IMAGE='$CONTAINER_IMAGE:backend-production' FRONTEND_IMAGE='$CONTAINER_IMAGE:frontend-production' BACKEND_ENV_FILE='.env.production' && docker compose -f deployment/compose/docker-compose.staging.yml pull"
    - ssh "$PRODUCTION_TARGET" "cd /opt/$APP_NAME && export BACKEND_IMAGE='$CONTAINER_IMAGE:backend-production' FRONTEND_IMAGE='$CONTAINER_IMAGE:frontend-production' BACKEND_ENV_FILE='.env.production' && docker compose -f deployment/compose/docker-compose.staging.yml up -d --remove-orphans"

    # Diagnostics
    - ssh "$PRODUCTION_TARGET" "cd /opt/$APP_NAME && export BACKEND_IMAGE='$CONTAINER_IMAGE:backend-production' FRONTEND_IMAGE='$CONTAINER_IMAGE:frontend-production' BACKEND_ENV_FILE='.env.production' && docker compose -f deployment/compose/docker-compose.staging.yml ps"
    - ssh "$PRODUCTION_TARGET" "docker logs personalia-backend --since 5m --tail 80 || true"
    - ssh "$PRODUCTION_TARGET" "docker logs personalia-frontend --since 5m --tail 80 || true"

  environment:
    name: production
    url: https://$PRODUCTION_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  needs:
    - build-backend-production
    - build-frontend-production

# ==================== POST-DEPLOY ====================

health-check-staging:
  stage: post-deploy
  <<: *deploy-template
  script:
    - '[ -n "$STAGING_SERVER_USER" ] || (echo "Missing CI variable: STAGING_SERVER_USER" && exit 1)'
    - '[ -n "$STAGING_SERVER_IP" ] || (echo "Missing CI variable: STAGING_SERVER_IP" && exit 1)'
    - export STAGING_TARGET="${STAGING_SERVER_USER}@${STAGING_SERVER_IP}"
    - export STAGING_API_DOMAIN="${STAGING_API_DOMAIN:-api-staging-personalia.bpkpenaburjakarta.or.id}"
    - echo "Waiting for services to be ready..."
    - sleep 20
    - echo "Checking backend container health..."
    - ssh "$STAGING_TARGET" "docker inspect -f '{{.State.Health.Status}}' personalia-backend | grep -q '^healthy$'"
    - echo "Checking frontend container health..."
    - ssh "$STAGING_TARGET" "docker inspect -f '{{.State.Health.Status}}' personalia-frontend | grep -q '^healthy$'"
    - echo "Checking Loki container state..."
    - ssh "$STAGING_TARGET" "docker inspect -f '{{.State.Status}}' personalia-loki | grep -q '^running$'"
    - echo "Checking Promtail container state..."
    - ssh "$STAGING_TARGET" "docker inspect -f '{{.State.Status}}' personalia-promtail | grep -q '^running$'"
    - echo "Checking local backend endpoint..."
    - ssh "$STAGING_TARGET" "wget -q --spider http://127.0.0.1:3001/health"
    - echo "Checking local frontend endpoint..."
    - ssh "$STAGING_TARGET" "wget -q --spider http://127.0.0.1:3000/"
    - echo "Checking local Loki endpoint..."
    - ssh "$STAGING_TARGET" "wget -q --spider http://127.0.0.1:3100/ready"
    - echo "Checking local Promtail endpoint..."
    - ssh "$STAGING_TARGET" "wget -q --spider http://127.0.0.1:9080/ready"
    - echo "Checking public frontend endpoint..."
    - wget -q --spider "https://$STAGING_DOMAIN/"
    - echo "Checking public API endpoint..."
    - wget -q --spider "https://$STAGING_API_DOMAIN/health"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - deploy-staging

health-check-production:
  stage: post-deploy
  <<: *deploy-template
  script:
    - '[ -n "$PRODUCTION_SERVER_USER" ] || (echo "Missing CI variable: PRODUCTION_SERVER_USER" && exit 1)'
    - '[ -n "$PRODUCTION_SERVER_IP" ] || (echo "Missing CI variable: PRODUCTION_SERVER_IP" && exit 1)'
    - export PRODUCTION_TARGET="${PRODUCTION_SERVER_USER}@${PRODUCTION_SERVER_IP}"
    - echo "Waiting for services to be ready..."
    - sleep 20
    - echo "Checking backend container health..."
    - ssh "$PRODUCTION_TARGET" "docker inspect -f '{{.State.Health.Status}}' personalia-backend | grep -q '^healthy$'"
    - echo "Checking frontend container health..."
    - ssh "$PRODUCTION_TARGET" "docker inspect -f '{{.State.Health.Status}}' personalia-frontend | grep -q '^healthy$'"
    - 'echo "Public endpoint check (non-blocking): https://$PRODUCTION_DOMAIN/health"'
    - 'wget -q --spider "https://$PRODUCTION_DOMAIN/health" || echo "Warning: public health endpoint unavailable (possible Cloudflare 521)"'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs:
    - deploy-production
