events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting (more lenient for staging)
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/s;

    # Security Headers (staging-specific)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' http: https: data: blob:" always;
    add_header X-Environment "staging" always;

    # Upstream for the Node.js app
    upstream personalia_app {
        server app:3001;
        keepalive 32;
    }

    # HTTP Server
    server {
        listen 80;
        server_name staging-personalia.bpkpenaburjakarta.or.id _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "staging-healthy\n";
            add_header Content-Type text/plain;
        }

        # Staging info endpoint
        location /staging-info {
            access_log off;
            return 200 '{"environment":"staging","version":"1.0.0","timestamp":"2025-08-27T15:00:00+07:00"}';
            add_header Content-Type application/json;
        }

        # API routes with more lenient rate limiting for testing
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://personalia_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Environment "staging";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }

        # Static file serving for uploads
        location /uploads/ {
            limit_req zone=uploads burst=20 nodelay;
            
            alias /var/www/uploads/;
            expires 1h;
            add_header Cache-Control "public";
            
            # Security for uploaded files
            location ~* \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
                deny all;
            }
        }

        # Debug endpoints (staging only)
        location /debug/ {
            # Allow debug endpoints in staging
            proxy_pass http://personalia_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Environment "staging";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }

        # Main application
        location / {
            proxy_pass http://personalia_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Environment "staging";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    }

    # HTTPS Server (Let's Encrypt ready - uncomment after SSL setup)
    server {
        listen 443 ssl;
        http2 on;
        server_name staging-personalia.bpkpenaburjakarta.or.id;
    
        # Let's Encrypt SSL Configuration
        ssl_certificate /etc/letsencrypt/live/staging-personalia.bpkpenaburjakarta.or.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging-personalia.bpkpenaburjakarta.or.id/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozTLS:10m;
        ssl_session_tickets off;
    
        # Modern configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
    
        # HSTS (less strict for staging)
        add_header Strict-Transport-Security "max-age=31536000" always;
    
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "staging-healthy-ssl\n";
            add_header Content-Type text/plain;
        }
    
        # Staging info endpoint
        location /staging-info {
            access_log off;
            return 200 '{"environment":"staging","version":"1.0.0","ssl":true,"timestamp":"2025-08-27T15:00:00+07:00"}';
            add_header Content-Type application/json;
        }
    
        # API routes
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://personalia_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Environment "staging";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    
        # Static file serving for uploads
        location /uploads/ {
            limit_req zone=uploads burst=20 nodelay;
            
            alias /var/www/uploads/;
            expires 1h;
            add_header Cache-Control "public";
            
            location ~* \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
                deny all;
            }
        }
    
        # Debug endpoints (staging only)
        location /debug/ {
            proxy_pass http://personalia_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Environment "staging";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    
        # Main application
        location / {
            proxy_pass http://personalia_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Environment "staging";
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    }

    # Let's Encrypt challenge location (always available)
    server {
        listen 80;
        server_name staging.your-domain.com;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirect other traffic to HTTPS (uncomment after SSL setup)
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
}
