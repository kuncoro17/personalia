name: personalia_jkt

services:
  postgres:
    image: postgres:15-alpine
    container_name: personalia_jkt_postgres
    environment:
      POSTGRES_DB: personalia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: asd
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - personalia_jkt_postgres_data:/var/lib/postgresql/data
      - ./deployment/be/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personalia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: personalia_jkt_redis
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - personalia_jkt_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: personalia_jkt_backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      AUTO_SYNC_MODELS: ${AUTO_SYNC_MODELS:-true}
      PORT: 3001
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-personalia}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-asd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret}
      SAS_AUTO_LOGIN_SECRET: ${SAS_AUTO_LOGIN_SECRET}
      SAS_AUTO_LOGIN_TTL_SECONDS: ${SAS_AUTO_LOGIN_TTL_SECONDS:-300}
      SAS_AUTO_LOGIN_NONCE_TTL_SECONDS: ${SAS_AUTO_LOGIN_NONCE_TTL_SECONDS:-300}
      SAS_VERIFY_TOKEN_TTL_SECONDS: ${SAS_VERIFY_TOKEN_TTL_SECONDS:-300}
      SAS_SESSION_JWT_EXPIRES_IN: ${SAS_SESSION_JWT_EXPIRES_IN:-1h}
      SAS_AUTO_LOGIN_RATE_LIMIT: ${SAS_AUTO_LOGIN_RATE_LIMIT:-30}
      SAS_VERIFY_RATE_LIMIT: ${SAS_VERIFY_RATE_LIMIT:-60}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-30}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-20}
      CORS_ALLOWED_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CLERK_SIGN_IN_URL: ${VITE_CLERK_SIGN_IN_URL}
        VITE_CLERK_DOMAIN: ${VITE_CLERK_DOMAIN}
        VITE_CLERK_IS_SATELLITE: ${VITE_CLERK_IS_SATELLITE:-true}
        VITE_SAS_PORTAL_URL: ${VITE_SAS_PORTAL_URL}
    container_name: personalia_jkt_frontend
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3002/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  personalia_jkt_postgres_data:
  personalia_jkt_redis_data:
