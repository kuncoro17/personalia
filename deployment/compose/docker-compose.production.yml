name: personalia-jkt-production

services:
  redis:
    image: redis:7-alpine
    container_name: personalia-jkt-redis
    expose:
      - "6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    container_name: personalia-jkt-backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3001"
    env_file:
      - ../../backend/${BACKEND_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      AUTO_SYNC_MODELS: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ../../backend/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - personalia-network
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: personalia-jkt-frontend
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3002/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - personalia-network
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    container_name: personalia-jkt-loki
    user: "0"
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3100/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - personalia-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: personalia-jkt-promtail
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_ENDPOINT: ${LOKI_ENDPOINT:-http://loki:3100/loki/api/v1/push}
    ports:
      - "127.0.0.1:${PROMTAIL_HOST_PORT:-9080}:9080"
    volumes:
      - ../observability/promtail-production-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - personalia-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  loki_data:
    driver: local

networks:
  personalia-network:
    driver: bridge
