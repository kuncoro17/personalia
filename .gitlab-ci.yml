stages:
  - validate
  - test
  - build
  - deploy
  - post-deploy

variables:
  LOG_LEVEL: INFO
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ''
  DOCKER_HOST: tcp://docker:2375
  APP_NAME: personalia-jkt
  CONTAINER_IMAGE: $CI_REGISTRY_IMAGE

default:
  image: node:18-alpine

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# ==================== DEPLOY TEMPLATE ====================

.deploy-template: &deploy-template
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

# ==================== VALIDATE ====================

lint:
  stage: validate
  script:
    - npm install --cache .npm --prefer-offline
    - npm run lint:check
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ==================== TEST ====================

test:
  stage: test
  script:
    - npm install --cache .npm --prefer-offline
    - npm run test:ci
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - lint
  allow_failure: true

# ==================== BUILD ====================

build-backend-staging:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f Dockerfile.backend -t "$CONTAINER_IMAGE/backend:staging" .
    - docker push "$CONTAINER_IMAGE/backend:staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

build-frontend-staging:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f Dockerfile.frontend -t "$CONTAINER_IMAGE/frontend:staging" .
    - docker push "$CONTAINER_IMAGE/frontend:staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# ==================== DEPLOY ====================

deploy-staging:
  stage: deploy
  <<: *deploy-template
  script:
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "mkdir -p /opt/$APP_NAME"
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "cd /opt/$APP_NAME && echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin $CI_REGISTRY"
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "cd /opt/$APP_NAME && docker compose pull"
    - ssh "$STAGING_SERVER_USER@$STAGING_SERVER_IP" "cd /opt/$APP_NAME && docker compose up -d"
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - build-backend-staging
    - build-frontend-staging

# ==================== POST DEPLOY ====================

health-check-staging:
  stage: post-deploy
  image: curlimages/curl
  script:
    - curl -f https://$STAGING_DOMAIN/health
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  needs:
    - deploy-staging